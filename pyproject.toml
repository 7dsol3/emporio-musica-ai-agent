[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-konaet-agent"
version = "1.0.0"
description = "A grounded customer service agent for Empório da Música"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
include = ["emporio*"]

[tool.setuptools.package-data]
emporio = ["web/*", "vendor/KONAET_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
